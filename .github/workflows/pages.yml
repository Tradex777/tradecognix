name: Deploy site to GitHub Pages

# Publishes web/ (and admin/ at /admin/) to the gh-pages branch, which GitHub Pages serves at
# https://tradex777.github.io/tradecognix/
on:
  push:
    branches: [main]
    paths: ["web/**", "admin/**", "brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/admin
          cp -r web/. _site/
          cp -r admin/. _site/admin/
          rm -f _site/netlify.toml _site/vercel.json
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
