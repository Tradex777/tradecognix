# Render free tier: PAPER TRADING / DEMO ONLY.
# Render's free web services sleep when idle and have no static outbound IP, so they cannot
# satisfy broker static-IP whitelisting for live orders. Use the Oracle Cloud VM path for live.
services:
  - type: web
    name: tradecognix-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"   # Render terminates TLS in front of the app
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: BETA_PLAN
        value: "pro"
      - key: DATABASE_URL
        sync: false   # Supabase Postgres connection string (free); leave empty for SQLite (resets on redeploy)
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: FERNET_KEY
        generateValue: true   # any 32+ char secret works; the app derives a Fernet key from it
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tradex777.github.io
      - key: ALLOW_SYNTHETIC_DATA
        value: "false"   # real NSE candles only (platform Angel One account below)
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: ADMIN_EMAILS
        value: contact@devcognix.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
